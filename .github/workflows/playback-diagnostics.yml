name: Playback diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'playback_diagnostics.py'
      - 'repack_control.py'
      - 'test_playback_diagnostics.py'
      - 'test_repack_control.py'
      - '.github/workflows/playback-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare public fixture
        run: |
          python -m pip install six==1.17.0 mpyq==0.2.5
          mkdir -p work
          python scripts/restore_artifact.py checkpoints/44256/TEN_GREYMANE_protocol44256.StormReplay.base64 checkpoints/44256/TEN_GREYMANE_protocol44256.StormReplay --sha256 checkpoints/44256/TEN_GREYMANE_protocol44256.StormReplay.sha256
      - name: Test diagnostics and payload-preserving control
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee work/playback-diagnostic-tests.log
          import unittest
          suite = unittest.TestLoader().loadTestsFromNames(['test_playback_diagnostics', 'test_repack_control'])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 22:
              raise SystemExit(1)
          PY
      - name: Preserve complete source history
        run: git bundle create work/hots-playback-diagnostics-complete.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playback-diagnostics-${{ github.run_id }}
          retention-days: 30
          path: |
            work/playback-diagnostic-tests.log
            work/hots-playback-diagnostics-complete.bundle
