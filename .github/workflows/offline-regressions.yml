name: Complete offline unit regressions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-unit:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux complete corpus
            os: ubuntu-24.04
            powershell: ''
          - name: Windows / PowerShell 7 complete corpus
            os: windows-2025
            powershell: pwsh
          - name: Windows / PowerShell 5.1 complete corpus
            os: windows-2025
            powershell: powershell
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HOTS_TEST_POWERSHELL: ${{ matrix.powershell }}
      NGS_RANGE_CONTROL: work/known-sky.StormReplay
      HOTS_EU_REFERENCE_CONTROL: work/current-eu.StormReplay
      PYTHONDONTWRITEBYTECODE: '1'
      # Apply before both checkouts; pinned schema hashes require Git blob bytes.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Blizzard/heroprotocol
          ref: 9af3ea7150f1a8acb53464c92519a9bbcc7a3594
          path: _upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Configure native Python import paths and verify the schema pin
        run: |
          test "$(git -C _upstream rev-parse HEAD)" = "9af3ea7150f1a8acb53464c92519a9bbcc7a3594"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path.cwd()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('PYTHONPATH=' + os.pathsep.join([str(root / '_upstream'), str(root)]) + '\n')
          PY
      - name: Install pinned small parser dependencies
        run: python -m pip install --disable-pip-version-check six==1.17.0 mpyq==0.2.5
      - name: Install the existing independent Linux archive reader
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libstorm-dev
      - name: Restore hash-bound offline test inputs only
        run: |
          source=artifacts/TEN_GREYMANE_source_41810.StormReplay
          python scripts/restore_artifact.py "$source.base64" work/TEN_GREYMANE_source_41810.StormReplay --sha256 "$source.sha256"
          fixture=checkpoints/44256/TEN_GREYMANE_protocol44256.StormReplay
          python scripts/restore_artifact.py "$fixture.base64" "$fixture" --sha256 "$fixture.sha256"
          r3=client-checkpoints/98285-native-r3/TEN_GREYMANE_client98285_NATIVE_R3_EXPERIMENTAL.StormReplay
          python scripts/restore_artifact.py "$r3.base64" "$r3" --sha256 "$r3.sha256"
          r4=client-checkpoints/98285-controls-r4/TEN_GREYMANE_client98285_CONTROLS_R4_EXPERIMENTAL.StormReplay
          python scripts/restore_artifact.py "$r4.base64" work/R4.StormReplay --sha256 "$r4.sha256"
      - name: Acquire one SHA-bound public fixture for offline range transport tests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import urllib.request
          from ngs_range_details import NoRedirect
          url = 'https://s3.amazonaws.com/ngs-replay-storage/ngs_10-16-2026_Protectors_of_Shakuras_vs_Crowd_Control_Syndicate_Sky_Temple.stormReplay'
          expected_bytes = 1357323
          with urllib.request.build_opener(NoRedirect).open(url, timeout=45) as response:
              if response.code != 200:
                  raise RuntimeError('Known control is unavailable')
              raw = response.read(expected_bytes + 1)
          if len(raw) != expected_bytes or hashlib.sha256(raw).hexdigest() != 'afcf49a656068f343173fc79afff2d2ebf15066f531cb192382cdba9d1ea3272':
              raise RuntimeError('Known control digest or size differs')
          path = Path('work/known-sky.StormReplay')
          path.parent.mkdir(exist_ok=True)
          with path.open('xb') as stream:
              stream.write(raw)
          PY
      - name: Acquire the SHA-bound current EU reference
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import urllib.request
          from ngs_range_details import NoRedirect
          url = 'https://heroeslounge.gg/storage/app/uploads/public/6ac/402/4c8/6ac4024c86d1b923997665.stormreplay'
          with urllib.request.build_opener(NoRedirect).open(url, timeout=45) as response:
              if response.code != 200:
                  raise RuntimeError('Current EU reference is unavailable')
              raw = response.read(978482 + 1)
          if len(raw) != 978482 or hashlib.sha256(raw).hexdigest() != 'a3c97e9a669e73e4c2b19a8f6c5e2de0315cbc5725be82cf1e887ed6319a01c4':
              raise RuntimeError('Current EU reference size or digest differs')
          with Path(os.environ['HOTS_EU_REFERENCE_CONTROL']).open('xb') as stream:
              stream.write(raw)
          PY
      - name: Verify current EU streams, package versions, lobby suffix and native ClientInfo/MapInfo
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from reference_replay import checked_archive, inspect_reference
          from protocol_loader import load_protocol
          from migrate_replay import write_json
          from audit_battlelobby_mod_metadata import audit_member
          from battlelobby_attribute_layer import _Reader
          from battlelobby_tail import decode_tail, crosscheck
          from dependency_audit import cache_handle
          from mod_data_audit import dependency_prefix
          path = Path(os.environ['HOTS_EU_REFERENCE_CONTROL'])
          profile = inspect_reference(path, 96477, 98348)
          assert profile['file_sha256'] == 'a3c97e9a669e73e4c2b19a8f6c5e2de0315cbc5725be82cf1e887ed6319a01c4'
          assert profile['target']['m_version']['m_baseBuild'] == profile['target']['m_dataBuildNum'] == 98348
          assert profile['schema_file_sha256'] == 'e95b728028399e7ffcfd32dff5e0c5fa3077d3827837755ccf40da2efcedbc84'
          assert profile['target']['m_ngdpRootKey']['m_data'].hex() == 'c3b3c8bc82e3a5a62e550fdde9a40c28'
          assert {kind: data['count'] for kind, data in profile['streams'].items()} == {'game': 144708, 'message': 99, 'tracker': 6181}
          p = load_protocol(96477)
          archive = checked_archive(path)
          try:
              details = p.decode_replay_details(archive.read_file('replay.details'))
              initial = p.decode_replay_initdata(archive.read_file('replay.initData'))
              raw = archive.read_file('replay.server.battlelobby')
          finally:
              archive.close()
          assert {player['m_toon']['m_region'] for player in details['m_playerList']} == {2}
          mods = audit_member(raw, 'observed-11', 'current-observed')
          tail = decode_tail(raw, mods['terminal_handles_end_bit'], 'current-tail')
          checks = crosscheck(tail, details, initial)
          assert checks['players_checked'] == checks['details_player_count'] == 10
          assert checks['details_identity_and_slot_matches'] == checks['initdata_identity_and_slot_matches'] == 10
          assert checks['all_details_participants_match_tail_by_slot']
          assert checks['details_identity_multiset_equal'] and checks['initdata_identity_multiset_equal']
          assert checks['seed_matches_lobby'] and checks['seed_matches_game_description']
          assert checks['disabled_hero_list_equal']
          from native_clientinfo import audit_current_client_infos
          native = audit_current_client_infos(raw, tail)
          assert native['players_checked'] == 10
          assert native['native_ClientInfo_complete_ends_match']
          assert native['all_13_named_anchors_match'] and native['private_native_scope_and_toon_match']
          assert native['all_consumed_spans_reencode_exact']
          assert native['named_segment_width_histogram'] == [{'widths': [8, 64, 96, 31], 'records': 10}]
          assert native['TalkerId_choice_histogram'] == {0: 10}
          assert native['permission_count_histogram'] == {0: 10}
          assert native['observed_opaque_starts_one_bit_inside_native_network_field_records'] == 10
          print({'native_ClientInfo_records_checked': 10, 'native_ClientInfo_span_reencoding_exact': True})
          from native_mapinfo import audit_current_map_infos
          native_maps = audit_current_map_infos(raw, mods)
          assert native_maps['records_checked'] == len(mods['entries']) == 8
          assert native_maps['named_fields_per_record'] == 32
          assert native_maps['all_native_ends_and_identities_match_observed_records']
          assert native_maps['all_consumed_spans_reencode_exact']
          assert native_maps['last_two_field_width_histogram'] == [{'widths': [1, 31], 'records': 8}]
          assert native_maps['required_permission_count_histogram'] == {0: 8}
          print({'native_MapInfo_records_checked': 8, 'native_MapInfo_span_reencoding_exact': True})
          reader = _Reader(raw)
          reader.position = mods['mod_metadata_end_bit']
          terminal = [cache_handle(reader.blob(40)) for _ in range(reader.bits(6))]
          assert reader.position == mods['terminal_handles_end_bit']
          assert len(terminal) == 8 and {handle['region'] for handle in terminal} == {'EU'}
          assert terminal[3]['digest'] == 'f644ce88b9d1a1c15af40be380be285f3d2ffcaf901dc9c15da367e763ee75c0'
          identities = []
          for entry in mods['entries']:
              reader.position = entry['start_bit']
              identities.append([reader.bits(32), reader.bits(32)])
          assert identities[:4] == [[169990, 65580], [170002, 65559], [169991, 65552], [169992, 65663]]
          prefix = [cache_handle(bytes.fromhex(value)) for value in dependency_prefix(raw)['handles']]
          assert prefix == [cache_handle(value) for value in details['m_cacheHandles']]
          assert prefix == [cache_handle(value) for value in initial['m_syncLobbyState']['m_gameDescription']['m_cacheHandles']]
          assert len(prefix) == 8 and {handle['region'] for handle in prefix} == {'EU'}
          write_json('work/current-eu-profile.json', profile)
          write_json('work/current-eu-structure.json', {'format': 'hots-current-eu-ci-structure-v1', 'replay_sha256': profile['file_sha256'], 'base_package_id_version_pairs': identities[:4], 'terminal_header_digests': [handle['digest'] for handle in terminal], 'prefix_and_independent_stream_handles_equal': True, 'tail': tail.report, 'native_ClientInfo': native, 'native_MapInfo': native_maps, 'private_crosscheck': checks, 'client_launched': False, 'replay_modified': False, 'simulation_or_conversion_proven': False})
          print({'current_EU_stream_counts': {kind: data['count'] for kind, data in profile['streams'].items()}, 'complete_lobby_EOF': True, 'base_packages': identities[:4]})
          PY
      - name: Discover and run every root test module with explicit platform gaps
        run: python scripts/run_offline_regressions.py --report work/offline-unit-regression.json
      - name: Retain counts and sanitized current EU reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-unit-${{ matrix.os }}-${{ matrix.powershell || 'python' }}-${{ github.run_id }}
          path: |
            work/offline-unit-regression.json
            work/current-eu-profile.json
            work/current-eu-structure.json
          if-no-files-found: warn
          retention-days: 14
