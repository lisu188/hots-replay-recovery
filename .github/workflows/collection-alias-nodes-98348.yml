name: Exact 98348 legacy alias node evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collection-alias-nodes-98348.yml'
      - 'scan_collection_alias_nodes.py'
      - 'collection_license_audit.py'
      - 'observations/collection-license-current-98348.json'
      - 'test_scan_collection_alias_nodes.py'
      - 'observations/collection-identities-2026-10-18.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collection-alias-node-evidence-98348
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  alias-nodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Test exact-node matching and complete inventory guards
        run: python -B -m unittest -v test_scan_collection_alias_nodes
      - name: Fetch and verify the previously reviewed headless extractor
        run: |
          set -euo pipefail
          mkdir -p work/alias-evidence work/extractor work/raw
          curl --fail --location --retry 2 --max-time 120 'https://github.com/HeroesToolChest/HeroesDataParser/releases/download/v5.1.0/HeroesDataParser.5.1.0-scd-linux-x64.tar.gz' -o work/extractor.tar.gz
          echo 'd5db68a8659456c287df3ed65d64c4786a6501e8f1c638008c81032e90da9f9d  work/extractor.tar.gz' | sha256sum --check
          tar -xzf work/extractor.tar.gz -C work/extractor
          executable=$(find "$PWD/work/extractor" -type f -name HeroesDataParser)
          test -n "$executable"
          test "$(printf '%s\n' "$executable" | wc -l)" -eq 1
          chmod +x "$executable"
          printf 'HDP=%s\n' "$executable" >> "$GITHUB_ENV"
          "$executable" --version > work/alias-evidence/extractor-version.log
      - name: Require the official live manifest and extractor to agree on 98348
        run: |
          set -euo pipefail
          curl --fail --max-time 60 https://eu.patch.battle.net/hero/versions -o work/alias-evidence/live-versions.txt
          timeout 180 "$HDP" online --heroes-version 2>&1 | tee work/alias-evidence/live-version.log
          python - <<'PY'
          import re
          from pathlib import Path
          root = Path('work/alias-evidence')
          raw = (root / 'live-versions.txt').read_text()
          lines = [line for line in raw.splitlines() if line.startswith('eu|')]
          if len(lines) != 1:
              raise RuntimeError('Missing unique official EU version row')
          fields = lines[0].split('|')
          if fields[1] != 'a64c9b7ebf1c6a811ffefad97865ed80' or fields[4:6] != ['98348', '2.57.0.98348']:
              raise RuntimeError('Official target changed; do not substitute another build')
          versions = set(re.findall(r'\b2\.[0-9]+\.[0-9]+\.[0-9]+(?:_ptr)?\b', (root / 'live-version.log').read_text()))
          if versions != {'2.57.0.98348'}:
              raise RuntimeError('Extractor reports a different live source: ' + repr(versions))
          PY
      - name: Extract raw catalog XML only into temporary runner storage
        run: |
          set -euo pipefail
          timeout 720 "$HDP" casc-extract online -i '**/gamedata/**' -i '**/gamedata.xml' -i '**/buildid.txt' -o "$PWD/work/raw" 2>&1 | tee work/alias-evidence/extraction.log
      - name: Scan exact unresolved names in every hash-bound current XML file
        run: python -B scan_collection_alias_nodes.py --root work/raw --projection observations/collection-license-current-98348.json --collection-observation observations/collection-identities-2026-10-18.json --version-log work/alias-evidence/live-version.log --output work/alias-evidence/alias-nodes.json
      - name: Publish matching static node contexts and precise scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('work/alias-evidence/alias-nodes.json').read_text())
          report['generation_provenance'] = {
              'repository_commit': os.environ['GITHUB_SHA'],
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'scanner_sha256': hashlib.sha256(Path('scan_collection_alias_nodes.py').read_bytes()).hexdigest(),
              'collector_sha256': hashlib.sha256(Path('collection_license_audit.py').read_bytes()).hexdigest(),
              'extractor_release': '5.1.0',
              'extractor_archive_sha256': 'd5db68a8659456c287df3ed65d64c4786a6501e8f1c638008c81032e90da9f9d',
              'official_manifest_sha256': hashlib.sha256(Path('work/alias-evidence/live-versions.txt').read_bytes()).hexdigest(),
              'expected_build_config': 'a64c9b7ebf1c6a811ffefad97865ed80',
          }
          Path('observations/collection-alias-nodes-current-98348.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c collection-alias-nodes-${GITHUB_RUN_ID}
          git add -- observations/collection-alias-nodes-current-98348.json
          if ! git diff --cached --quiet; then
            git commit -m "Record exact 98348 legacy-name node evidence for run ${GITHUB_RUN_ID}"
            git fetch origin main
            git diff --exit-code "$GITHUB_SHA" origin/main -- scan_collection_alias_nodes.py collection_license_audit.py .github/workflows/collection-alias-nodes-98348.yml observations/collection-identities-2026-10-18.json observations/collection-license-current-98348.json
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: collection-alias-node-evidence-98348-${{ github.run_id }}
          retention-days: 30
          path: work/alias-evidence/
