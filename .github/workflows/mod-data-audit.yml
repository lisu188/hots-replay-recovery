name: Mod data dependency audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mod-data-audit.yml'
      - 'mod_data_audit.py'
      - 'test_mod_data_audit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-data-audit
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/_upstream:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Blizzard/heroprotocol
          ref: 9af3ea7150f1a8acb53464c92519a9bbcc7a3594
          path: _upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Restore immutable public audit inputs
        run: |
          python -m pip install six==1.17.0
          mkdir -p work/mod-data
          source=artifacts/TEN_GREYMANE_source_41810.StormReplay
          python scripts/restore_artifact.py "$source.base64" work/TEN_GREYMANE_source_41810.StormReplay --sha256 "$source.sha256"
          r4=client-checkpoints/98285-controls-r4/TEN_GREYMANE_client98285_CONTROLS_R4_EXPERIMENTAL.StormReplay
          python scripts/restore_artifact.py "$r4.base64" work/r4.StormReplay --sha256 "$r4.sha256"
      - name: Test prefix parsing and reference guards
        run: python -m unittest -v test_mod_data_audit test_dependency_audit 2>&1 | tee work/mod-data/tests.log
      - name: Audit the actual R4 without changing its bytes
        run: |
          python mod_data_audit.py inspect work/r4.StormReplay --schema-build 96477 --expected-build 98285 --output work/mod-data/r4.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          report = json.loads(Path('work/mod-data/r4.json').read_text())
          if report['file_sha256'] != 'edd690c6956b48c1592edf946bc8e01e012220c961b04cf3d86ec983c808367c':
              raise RuntimeError('Wrong R4 input')
          if report['mod_file_sync_checksum'] != 3522231966 or report['dependencies']['prefix_bytes'] != 861:
              raise RuntimeError('Unexpected actual dependency data')
          log = Path('work/mod-data/tests.log').read_text()
          if not log.rstrip().endswith('OK') or 'skipped' in log.lower():
              raise RuntimeError('Incomplete test run')
          result = {'run_id': int(os.environ['GITHUB_RUN_ID']), 'tested_commit': os.environ['GITHUB_SHA'],
                    'tests': int(re.search(r'Ran (\d+) tests', log)[1]),
                    'files': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                              for name in ('mod_data_audit.py', 'test_mod_data_audit.py')},
                    'private_donor_supplied_to_ci': False, 'new_replay_created': False,
                    'client_playback_validated': False}
          Path('work/mod-data/ci-verification.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Preserve complete source history
        if: always()
        run: |
          mkdir -p work/mod-data
          git bundle create work/mod-data/source.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mod-data-audit-${{ github.run_id }}
          retention-days: 30
          path: work/mod-data/
