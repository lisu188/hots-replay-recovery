name: Offline battlelobby serialization and static package evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/battlelobby-attributes.yml'
      - 'battlelobby_attribute_layer.py'
      - 'test_battlelobby_attribute_layer.py'
      - 'scripts/verify_battlelobby_layer.py'
      - 'audit_battlelobby_mod_metadata.py'
      - 'test_audit_battlelobby_mod_metadata.py'
      - 'scripts/verify_battlelobby_mod_metadata.py'
      - 'battlelobby_arcade_sections.py'
      - 'depot_s2mh_wire.py'
      - 'test_battlelobby_arcade_sections.py'
      - 'scripts/verify_authenticated_arcade_sections.py'
      - 'battlelobby_tail.py'
      - 'test_battlelobby_tail.py'
      - 'scripts/verify_battlelobby_tail.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-layer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}/_upstream:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Blizzard/heroprotocol
          ref: 9af3ea7150f1a8acb53464c92519a9bbcc7a3594
          path: _upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Configure native Python import paths
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path.cwd()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('PYTHONPATH=' + os.pathsep.join([str(root / '_upstream'), str(root)]) + '\n')
          PY
      - name: Materialize exact pinned upstream Git blobs on both platforms
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          root = Path('_upstream')
          commit = '9af3ea7150f1a8acb53464c92519a9bbcc7a3594'
          actual = subprocess.run(['git', '-C', str(root), 'rev-parse', 'HEAD'], capture_output=True, text=True, check=True).stdout.strip()
          if actual != commit:
              raise RuntimeError('Pinned upstream checkout changed')
          for build, expected in ((41810, '879d228d9d8acd21d63563538dd15841aaf49259ee0bb468b8a46b6a4ef866fd'), (96477, 'e95b728028399e7ffcfd32dff5e0c5fa3077d3827837755ccf40da2efcedbc84')):
              relative = f'heroprotocol/versions/protocol{build}.py'
              raw = subprocess.run(['git', '-C', str(root), 'show', commit + ':' + relative], capture_output=True, check=True).stdout
              if hashlib.sha256(raw).hexdigest() != expected:
                  raise RuntimeError('Canonical upstream blob digest differs')
              path = root / relative
              if path.read_text(encoding='utf-8').encode('utf-8') != raw:
                  raise RuntimeError('Upstream file differs beyond checkout line endings')
              path.write_bytes(raw)
          print('Both official schema files exactly match their pinned Git blobs')
          PY
      - name: Install pinned small parser dependencies
        run: python -m pip install six==1.17.0 mpyq==0.2.5
      - name: Test malformed inputs, field preservation and inverse conversion
        run: python -m unittest -v test_battlelobby_attribute_layer test_audit_battlelobby_mod_metadata test_battlelobby_arcade_sections test_battlelobby_tail
      - name: Restore hash-bound original and R8 without launching HotS
        run: |
          mkdir -p work
          python scripts/restore_artifact.py artifacts/TEN_GREYMANE_source_41810.StormReplay.base64 work/original.StormReplay --sha256 artifacts/TEN_GREYMANE_source_41810.StormReplay.sha256
          python scripts/restore_artifact.py client-checkpoints/98285-resumable-r8/TEN_GREYMANE_client98285_RESUMABLE_R8_PARTIAL.StormReplay.base64 work/r8.StormReplay --sha256 client-checkpoints/98285-resumable-r8/TEN_GREYMANE_client98285_RESUMABLE_R8_PARTIAL.StormReplay.sha256
      - name: Verify real source semantics and exact reversible member conversion
        run: python scripts/verify_battlelobby_layer.py --original work/original.StormReplay --candidate work/r8.StormReplay --output work/battlelobby-layer-verification.json
      - name: Audit historical mod metadata and named static arcade arrays
        run: python scripts/verify_battlelobby_mod_metadata.py --original work/original.StormReplay --candidate work/r8.StormReplay --output work/legacy-mod-metadata-verification.json
      - name: Acquire hash-bound public controls and small source package headers
        run: |
          python - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import urllib.request
          from pathlib import Path
          root = Path('work').resolve()
          manifest = json.loads(Path('observations/expanded-current-catalog-comparison-2026-10-18.json').read_text())
          refs = manifest['references']
          if len(refs) != 12 or sum(row['replay_bytes'] for row in refs) > 32 * 1024 * 1024:
              raise RuntimeError('Unexpected current cohort or download size')
          if any(type(row['replay_bytes']) is not int or not 0 < row['replay_bytes'] <= 5 * 1024 * 1024 for row in refs):
              raise RuntimeError('Individual replay size is outside the acquisition bound')
          if len({row['replay_sha256'] for row in refs}) != len(refs) or len({row['replay_file'] for row in refs}) != len(refs):
              raise RuntimeError('Duplicate replay content or destination')
          tasks = []
          for row in refs:
              if row['build'] != 98348 or not row['public_url'].startswith('https://s3.amazonaws.com/ngs-replay-storage/'):
                  raise RuntimeError('Unexpected source URL or build')
              path = (root / row['replay_file']).resolve()
              if not path.is_relative_to(root):
                  raise RuntimeError('Cohort path escaped work root')
              tasks.append((row['public_url'], path, row['replay_bytes'], row['replay_sha256']))
          headers = [
              '565fa52da08615e47c6105dc3036e925e80aa57d12b7bf5fd5c6757b12e7b5bd',
              '593cb51398ea52786c53e9c86d8f4d217148d452a691b38ef67d2a0d3add2596',
              '439eab2a4f3f7d224e5820486ab0cc161729f3de3d2d5ce2e80b35dc7eed3a88',
              'b34d0f30dc3b9cf47694982106a04006a49ce43422e02f71ed18b33b7bfcc6c4',
              '9bdcdbb192244902f650020fa302951b0fd1f5487aad0096df01ddccd7b4acd2',
          ]
          for digest in headers:
              tasks.append((f'https://eu-s2-depot.classic.blizzard.com/{digest}.s2mh', root / 'source-s2mh' / (digest + '.s2mh'), None, digest))
          def acquire(task):
              url, path, size, digest = task
              if path.exists():
                  raise RuntimeError('Refusing to replace existing acquisition')
              bound = size if size is not None else 2 * 1024 * 1024
              with urllib.request.urlopen(url, timeout=45) as response:
                  raw = response.read(bound + 1)
              if len(raw) > bound or (size is not None and len(raw) != size) or hashlib.sha256(raw).hexdigest() != digest:
                  raise RuntimeError('Public source size or content hash differs')
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('xb') as stream:
                  stream.write(raw)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(acquire, tasks))
          print('Verified 12 current replay controls and five original package headers')
          PY
      - name: Verify complete tails, private identities and seeds on all fourteen replay fixtures
        run: python scripts/verify_battlelobby_tail.py --original work/original.StormReplay --candidate work/r8.StormReplay --cohort-manifest observations/expanded-current-catalog-comparison-2026-10-18.json --cohort-root work --output work/full-tail-verification.json
      - name: Extract source members for content-addressed static-section binding
        run: |
          python - <<'PY'
          from pathlib import Path
          from mpq_reader import MPQArchive
          for name in ('original', 'r8'):
              archive = MPQArchive(Path('work') / (name + '.StormReplay'))
              try:
                  with (Path('work') / (name + '.battlelobby.bin')).open('xb') as stream:
                      stream.write(archive.read_file('replay.server.battlelobby'))
              finally:
                  archive.close()
          PY
      - name: Bind named old arcade arrays to five exact Blizzard package headers
        run: python scripts/verify_authenticated_arcade_sections.py --case original legacy-10 historical-fixed work/original.battlelobby.bin work/source-s2mh --case r8 legacy-10 historical-fixed work/r8.battlelobby.bin work/source-s2mh --output work/source-static-package-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-battlelobby-layer-${{ matrix.os }}-${{ github.run_id }}
          retention-days: 30
          path: |
            work/battlelobby-layer-verification.json
            work/legacy-mod-metadata-verification.json
            work/full-tail-verification.json
            work/source-static-package-verification.json
