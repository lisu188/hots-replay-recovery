name: Exact-build catalog ordering evidence

on:
  push:
    branches: [main]
    paths: ['.github/workflows/catalog-order.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and run the pinned extractor
        run: |
          mkdir -p work/tool work/raw work/order
          curl --fail --location --retry 2 --max-time 120 'https://github.com/HeroesToolChest/HeroesDataParser/releases/download/v5.1.0/HeroesDataParser.5.1.0-scd-linux-x64.tar.gz' -o work/tool.tar.gz
          echo 'd5db68a8659456c287df3ed65d64c4786a6501e8f1c638008c81032e90da9f9d  work/tool.tar.gz' | sha256sum --check
          tar -xzf work/tool.tar.gz -C work/tool
          executable=$(find "$PWD/work/tool" -type f -name HeroesDataParser)
          test "$(printf '%s\n' "$executable" | wc -l)" -eq 1
          chmod +x "$executable"
          timeout 180 "$executable" online --heroes-version | tee work/order/version.log
          grep -Fx '2.57.0.98285' work/order/version.log
          timeout 420 "$executable" casc-extract online -i '**/gamedata/**' -i '**/gamedata.xml' -i '**/includes.xml' -i '**/documentinfo' -o "$PWD/work/raw" 2>&1 | tee work/order/extraction.log
      - name: Export declaration and reference identities without gameplay parameters
        run: |
          python - <<'PY'
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path('work/raw')
          trees = {}
          catalog_names = {'Unit': set(), 'Abil': set()}
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              if path.is_symlink() or path.stat().st_size > 64 * 1024 * 1024:
                  raise RuntimeError('Unexpected extracted file')
              if path.suffix.lower() == '.xml' or path.name.lower() == 'documentinfo':
                  element = ET.fromstring(path.read_bytes())
                  trees[path] = element
                  for child in element:
                      for catalog in catalog_names:
                          if child.tag.startswith('C' + catalog) and child.get('id'):
                              catalog_names[catalog].add(child.get('id'))
          all_names = set().union(*catalog_names.values())
          records = []
          for path, element in trees.items():
              raw = path.read_bytes()
              item = {'path': path.relative_to(root).as_posix(), 'size': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
              tokens = []
              for ordinal, owner in enumerate(element):
                  owner_kind = owner.tag
                  for subindex, node in enumerate(owner.iter()):
                      for attribute, value in node.attrib.items():
                          if value in all_names:
                              tokens.append({'owner_order': ordinal, 'owner_kind': owner_kind, 'owner_id': owner.get('id'), 'node_order': subindex, 'tag': node.tag, 'attribute': attribute, 'value': value, 'owner_default': owner.get('default')})
              if tokens:
                  item['identity_tokens'] = tokens
              if path.name.lower() in ('includes.xml', 'gamedata.xml', 'documentinfo', 'configdata.xml'):
                  item['load_references'] = [{'tag': node.tag, 'attributes': dict(node.attrib), 'text': (node.text or '').strip()} for node in element.iter() if node.tag in ('Path', 'Include', 'Catalog', 'HeroArray', 'Value')]
              records.append(item)
          if not catalog_names['Unit'] or not catalog_names['Abil']:
              raise RuntimeError('Missing catalog declarations')
          metadata = [json.loads(path.read_bytes()) for path in root.rglob('hdp.info')]
          result = {'format':'hots-catalog-order-evidence-v2','expected_build':98285,'indices_verified':False,'extractor_sha256':'d5db68a8659456c287df3ed65d64c4786a6501e8f1c638008c81032e90da9f9d','extraction_metadata':metadata,'known_names':{key:sorted(value) for key,value in catalog_names.items()},'requested_unit_and_ability_guid_tables_found':False,'files':records}
          Path('work/order/ordering-evidence.json').write_text(json.dumps(result, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: catalog-order-${{ github.run_id }}
          path: work/order/
          retention-days: 30
