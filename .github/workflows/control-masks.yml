name: Controlled lobby mask experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-masks.yml'
      - 'repair_control_masks.py'
      - 'test_control_masks.py'
      - 'observations/reference-98285-control-masks.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-control-masks-r4
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/_upstream:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Blizzard/heroprotocol
          ref: 9af3ea7150f1a8acb53464c92519a9bbcc7a3594
          path: _upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install independent reader and native checksum verifier
        run: |
          python -m pip install six==1.17.0 mpyq==0.2.5
          sudo apt-get update -qq
          sudo apt-get install -y libstorm-dev
          mkdir -p work
          dpkg-query -W libstorm9 libstorm-dev libtomcrypt1 libtommath1 > work/controls-native-packages.txt
      - name: Restore hash-bound public fixtures
        run: |
          source=artifacts/TEN_GREYMANE_source_41810.StormReplay
          python scripts/restore_artifact.py "$source.base64" work/TEN_GREYMANE_source_41810.StormReplay --sha256 "$source.sha256"
          fixture=checkpoints/44256/TEN_GREYMANE_protocol44256.StormReplay
          python scripts/restore_artifact.py "$fixture.base64" "$fixture" --sha256 "$fixture.sha256"
          r3=client-checkpoints/98285-native-r3/TEN_GREYMANE_client98285_NATIVE_R3_EXPERIMENTAL.StormReplay
          python scripts/restore_artifact.py "$r3.base64" "$r3" --sha256 "$r3.sha256"
      - name: Run new tests and existing regressions
        run: python -m unittest -v test_control_masks test_live_identity test_startup test_reference test_client_binding test_reproduce_client test_playback_diagnostics test_repack_control 2>&1 | tee work/controls-tests.log
      - name: Generate mask-only candidate twice
        run: |
          r3=client-checkpoints/98285-native-r3/TEN_GREYMANE_client98285_NATIVE_R3_EXPERIMENTAL.StormReplay
          python repair_control_masks.py --source "$r3" --observation observations/reference-98285-control-masks.json --output work/controls-r4 | tee work/controls-build.log
          python repair_control_masks.py --source "$r3" --observation observations/reference-98285-control-masks.json --output work/controls-r4-repeat > work/controls-repeat.log
          cmp work/controls-r4/*.StormReplay work/controls-r4-repeat/*.StormReplay
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          report = json.loads(Path('work/controls-r4/report.json').read_text())
          if report['artifact']['sha256'] != 'edd690c6956b48c1592edf946bc8e01e012220c961b04cf3d86ec983c808367c':
              raise RuntimeError('CI output differs from locally generated R4')
          if hashlib.sha256(Path('repair_control_masks.py').read_bytes()).hexdigest() != 'd01f86b3834ba8af5ca189c97a7283e3bbf2344cce29ae5c483836656ae44c06':
              raise RuntimeError('Generator differs from locally tested source; review and update the provenance pin')
          log = Path('work/controls-tests.log').read_text()
          if 'skipped' in log.lower() or not log.rstrip().endswith('OK'):
              raise RuntimeError('Tests did not all execute successfully')
          count = int(re.search(r'Ran (\d+) tests', log)[1])
          if count < 124:
              raise RuntimeError('Expected the complete 124-test set')
          result = {'run_id': int(os.environ['GITHUB_RUN_ID']), 'tested_commit': os.environ['GITHUB_SHA'],
                    'test_count': count, 'repeated_generation_identical': True, 'matches_local_sha256': True,
                    'candidate_sha256': report['artifact']['sha256'],
                    'code_sha256': hashlib.sha256(Path('repair_control_masks.py').read_bytes()).hexdigest(),
                    'private_donor_supplied_to_ci': False, 'client_playback_validated': False,
                    'cause_of_rejection_proven': False}
          Path('work/controls-r4/ci-verification.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Publish verified text checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c controls-r4-${GITHUB_RUN_ID}
          mkdir -p client-checkpoints/98285-controls-r4
          cp work/controls-r4/*.json work/controls-r4/*.jsonl work/controls-r4/*.sha256 work/controls-r4/*.base64.part* client-checkpoints/98285-controls-r4/
          git add -- client-checkpoints/98285-controls-r4
          git commit -m "Publish controlled R4 lobby mask experiment for run ${GITHUB_RUN_ID}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve complete source history
        if: always()
        run: |
          mkdir -p work
          git bundle create work/controls-r4-source.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: controls-r4-${{ github.run_id }}
          retention-days: 30
          path: |
            work/controls-r4/
            work/controls-*.log
            work/controls-native-packages.txt
            work/controls-r4-source.bundle
