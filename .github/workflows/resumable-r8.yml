name: Partial R8 resumable layout repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resumable-r8.yml'
      - 'repair_resumable_events.py'
      - 'test_resumable_events.py'
      - 'observations/resumable-layout-2026-09-29.json'
      - 'plan_catalog_migration.py'
      - 'test_catalog_migration_plan.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resumable-r8
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/_upstream:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Blizzard/heroprotocol
          ref: 9af3ea7150f1a8acb53464c92519a9bbcc7a3594
          path: _upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install independent readers and native writer
        run: |
          python -m pip install six==1.17.0 mpyq==0.2.5
          sudo apt-get update -qq
          sudo apt-get install -y libstorm-dev
          mkdir -p work
          dpkg-query -W libstorm9 libstorm-dev libtomcrypt1 libtommath1 > work/resumable-native-packages.txt
      - name: Check reviewed source and restore immutable fixtures
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          pins = {'repair_resumable_events.py': '8048a2bcf1cd22a3eb30182af3c7124bd193caae3ebd0c291a2293734deeeb2a',
                  'test_resumable_events.py': 'f89fcb22ab82e4211693161260817df3658479a6e710232c63be525a0b5c5e88',
                  'observations/resumable-layout-2026-09-29.json': 'c72fad298d71b0450353045f82807f2a7d4c0a145276caca948d0fe688bf9702',
                  'plan_catalog_migration.py': 'd08394153b8b0381235bf397f8c45b4e0fa4cf24ac176a99d6e52ac97c779a70',
                  'test_catalog_migration_plan.py': 'cca8a451a92214e14b053aef7b4d407c6e5271dd3069bcb56220b7a7041efa90'}
          for name, expected in pins.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected:
                  raise RuntimeError('Reviewed source differs: ' + name)
          PY
          source=artifacts/TEN_GREYMANE_source_41810.StormReplay
          python scripts/restore_artifact.py "$source.base64" work/TEN_GREYMANE_source_41810.StormReplay --sha256 "$source.sha256"
          fixture=checkpoints/44256/TEN_GREYMANE_protocol44256.StormReplay
          python scripts/restore_artifact.py "$fixture.base64" "$fixture" --sha256 "$fixture.sha256"
          r3=client-checkpoints/98285-native-r3/TEN_GREYMANE_client98285_NATIVE_R3_EXPERIMENTAL.StormReplay
          python scripts/restore_artifact.py "$r3.base64" "$r3" --sha256 "$r3.sha256"
          r4=client-checkpoints/98285-controls-r4/TEN_GREYMANE_client98285_CONTROLS_R4_EXPERIMENTAL.StormReplay
          python scripts/restore_artifact.py "$r4.base64" work/R4.StormReplay --sha256 "$r4.sha256"
          r6=client-checkpoints/98285-unit-tags-r6/TEN_GREYMANE_client98285_TAGS_R6_PARTIAL.StormReplay
          python scripts/restore_artifact.py "$r6.base64" work/R6.StormReplay --sha256 "$r6.sha256"
          r7=client-checkpoints/98285-flags-r7/TEN_GREYMANE_client98285_FLAGS_R7_PARTIAL.StormReplay
          python scripts/restore_artifact.py "$r7.base64" work/R7.StormReplay --sha256 "$r7.sha256"
      - name: Run new and existing regression suites
        run: python -m unittest -v test_resumable_events test_catalog_migration_plan test_catalog_capture test_catalog_capture_cli test_runtime_catalog_probe test_mixed_mpq_sectors test_command_flags test_catalog_diagnostics test_unit_tags test_mpyq_empty_members test_empty_mpq_members test_dragon_dependencies test_control_masks test_live_identity test_startup test_reference test_client_binding test_reproduce_client test_playback_diagnostics test_repack_control 2>&1 | tee work/resumable-tests.log
      - name: Revalidate recovered planner on the original without modifying it
        run: |
          python plan_catalog_migration.py --source work/TEN_GREYMANE_source_41810.StormReplay --output work/original-catalog-plan.json > work/resumable-planner.log
          python plan_catalog_migration.py --source work/TEN_GREYMANE_source_41810.StormReplay --output work/original-catalog-plan-repeat.json >> work/resumable-planner.log
          cmp work/original-catalog-plan.json work/original-catalog-plan-repeat.json
      - name: Generate twice and independently check the reversible layout change
        run: |
          python repair_resumable_events.py --source work/R7.StormReplay --output work/resumable-r8 | tee work/resumable-build.log
          python repair_resumable_events.py --source work/R7.StormReplay --output work/resumable-r8-repeat > work/resumable-repeat.log
          cmp work/resumable-r8/*.StormReplay work/resumable-r8-repeat/*.StormReplay
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from mpq_reader import MPQArchive
          from repair_resumable_events import decode, SOURCE_STREAM_SHA256
          from protocol_loader import load_protocol
          report = json.loads(Path('work/resumable-r8/report.json').read_text())
          if report['after']['sha256'] != '2d439945492b06bb4a606451b81c73d7299dd0ce29fe1c9e36ce91621741735c':
              raise RuntimeError('Migrated stream differs from the local full-stream observation')
          if report['before']['sha256'] != SOURCE_STREAM_SHA256 or report['after']['bytes'] != 935 or report['removed_color_fields'] != 65:
              raise RuntimeError('Unexpected resumable conversion')
          if report['events'] != {'game': 104257, 'message': 155, 'tracker': 6614}:
              raise RuntimeError('Event counts changed')
          if report['client_playback_validated'] or report['desync_cause_proven'] or report['sync_checks_removed_or_disabled']:
              raise RuntimeError('Unproven playback or modified synchronization')
          source = MPQArchive(Path('work/TEN_GREYMANE_source_41810.StormReplay'))
          try:
              p = load_protocol(41810)
              players = p.decode_replay_details(source.read_file('replay.details'))['m_playerList']
              records = decode(source.read_file('replay.resumable.events'), True)
              checked = 0
              for row in records:
                  if row.user_id == 16:
                      if row.name or row.legacy_color != 0xffffffff:
                          raise RuntimeError('Unexpected system record')
                      continue
                  player = players[row.user_id]
                  c = player['m_color']
                  bgra = c['m_b'] | (c['m_g'] << 8) | (c['m_r'] << 16) | (c['m_a'] << 24)
                  if player['m_name'] != row.name or bgra != row.legacy_color:
                      raise RuntimeError('Legacy field does not match recorded player color')
                  checked += 1
              if checked != 63:
                  raise RuntimeError('Expected 63 independently cross-checked player records')
          finally:
              source.close()
          plan = json.loads(Path('work/original-catalog-plan.json').read_text())
          if plan['coverage'] != {'source_links': 49, 'reviewable_links': 0, 'source_fields': 12557, 'fields_with_reviewable_link': 0, 'source_ability_links': 54, 'mapped_ability_links': 0} or plan['replay_modified']:
              raise RuntimeError('Original requirements changed or a mapping was invented')
          log = Path('work/resumable-tests.log').read_text()
          count = int(re.search(r'Ran (\d+) tests', log)[1])
          if count < 429 or 'skipped' in log.lower() or not log.rstrip().endswith('OK'):
              raise RuntimeError('All requested regressions must pass without skips')
          result = {'run_id': int(os.environ['GITHUB_RUN_ID']), 'tested_commit': os.environ['GITHUB_SHA'],
                    'tests': count, 'failed': 0, 'skipped': 0, 'repeated_native_generation_identical': True,
                    'candidate_sha256': report['artifact']['sha256'], 'matches_local_resumable_payload': True,
                    'original_player_color_records_checked': checked, 'planner_regeneration_identical': True,
                    'private_donor_supplied_to_ci': False, 'sync_payloads_unchanged': True,
                    'client_playback_validated': False, 'simulation_compatibility_validated': False}
          Path('work/resumable-r8/ci-verification.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Publish the explicitly partial text checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c resumable-r8-${GITHUB_RUN_ID}
          mkdir -p client-checkpoints/98285-resumable-r8
          cp work/resumable-r8/*.json work/resumable-r8/*.jsonl work/resumable-r8/*.sha256 work/resumable-r8/*.base64.part* client-checkpoints/98285-resumable-r8/
          git add -- client-checkpoints/98285-resumable-r8
          git commit -m "Publish reversible partial R8 checkpoint for run ${GITHUB_RUN_ID}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve complete source history
        if: always()
        run: |
          mkdir -p work
          git bundle create work/resumable-r8-source.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resumable-r8-${{ github.run_id }}
          retention-days: 30
          path: |
            work/resumable-r8/
            work/resumable-*.log
            work/resumable-native-packages.txt
            work/resumable-r8-source.bundle
            work/original-catalog-plan.json
