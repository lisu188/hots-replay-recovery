name: Bounded NGS metadata screening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ngs-range-details.yml'
      - 'ngs_range_details.py'
      - 'test_ngs_range_details.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  partial-metadata:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      NGS_RANGE_CONTROL: work/known-sky.StormReplay
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the pinned small MPQ reader
        run: python -m pip install six==1.17.0 mpyq==0.2.5
      - name: Acquire one SHA-bound public fixture for offline range transport tests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import urllib.request
          from ngs_range_details import NoRedirect
          url = 'https://s3.amazonaws.com/ngs-replay-storage/ngs_10-16-2026_Protectors_of_Shakuras_vs_Crowd_Control_Syndicate_Sky_Temple.stormReplay'
          expected_bytes = 1357323
          with urllib.request.build_opener(NoRedirect).open(url, timeout=45) as response:
              if response.code != 200:
                  raise RuntimeError('Known control is unavailable')
              raw = response.read(expected_bytes + 1)
          if len(raw) != expected_bytes or hashlib.sha256(raw).hexdigest() != 'afcf49a656068f343173fc79afff2d2ebf15066f531cb192382cdba9d1ea3272':
              raise RuntimeError('Known control digest or size differs')
          path = Path('work/known-sky.StormReplay')
          path.parent.mkdir(exist_ok=True)
          with path.open('xb') as stream:
              stream.write(raw)
          PY
      - name: Test refusal rules and actual MPQ metadata through fake ranges
        run: python -B -m unittest -v test_ngs_range_details
