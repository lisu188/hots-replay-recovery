name: Bank-independent catalog journal

on:
  push:
    branches: [main]
    paths:
      - 'runtime_catalog_journal.py'
      - 'test_catalog_journal.py'
      - 'test_catalog_journal_collector.py'
      - 'scripts/run_catalog_journal.ps1'
      - 'scripts/START_CATALOG_JOURNAL.cmd'
      - '.github/workflows/catalog-journal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rameshvarun/galaxy-parser
          ref: c2f9cc65f234fef07261879b27a23ee796ff07f3
          path: _galaxy
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Acquire the hash-bound source and independent readers
        run: |
          set -euo pipefail
          mkdir -p work/journal-evidence
          python -m pip install six==1.17.0 mpyq==0.2.5
          sudo apt-get update -qq
          sudo apt-get install -y libstorm-dev
          curl --fail --location --retry 2 --max-time 120 https://raw.githubusercontent.com/jamiephan/HeroesOfTheStorm_S2MA/2bc3715018424208faf200c141756d9a19f9aafa/s2ma/f557190f8aaab160789272ce086b8b69d6a8037b152de150332603dae3dc098f.s2ma -o work/DragonShire.s2ma
          echo 'f557190f8aaab160789272ce086b8b69d6a8037b152de150332603dae3dc098f  work/DragonShire.s2ma' | sha256sum --check
          dpkg-query -W libstorm9 libstorm-dev > work/journal-evidence/native-packages.txt
      - name: Check reviewed source and run synthetic diagnostic regressions
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          pins = {'runtime_catalog_journal.py': '6cb64d75644821c3e68451eddc91ce5bf36be63a13ee1b5db495ea3a60f98004',
                  'test_catalog_journal.py': '924086fa7b9dc9be7d70dbb4768d83edf8ca17a21f81a7c55baf5d8413122ed1',
                  'scripts/run_catalog_journal.ps1': 'cec468ef0d8816eb711dbbb8f218340842190754b1881f05768d1fe2a9893401',
                  'runtime_catalog_probe.py': 'a6f7c816ec0106ca2b2e687ff6ee0f17a189cfd078e626b287649e6c48b21c5a',
                  'mpq_mixed_sectors.py': '206ca1b13aedcc080600c66edc43cf13d1817c47f53da0e7e7800a09e69dc9fe'}
          for name, expected in pins.items():
              assert hashlib.sha256(Path(name).read_bytes().replace(b'\r\n', b'\n')).hexdigest() == expected, name
          PY
          python -m unittest -v test_catalog_journal test_runtime_catalog_probe test_mixed_mpq_sectors test_catalog_capture test_catalog_capture_cli 2>&1 | tee work/journal-evidence/tests.log
      - name: Generate twice and compare every map payload independently
        run: |
          set -euo pipefail
          python runtime_catalog_journal.py build work/DragonShire.s2ma --output work/journal-map > work/journal-evidence/build.log
          python runtime_catalog_journal.py build work/DragonShire.s2ma --output work/journal-repeat > work/journal-evidence/repeat.log
          cmp work/journal-map/*.StormMap work/journal-repeat/*.StormMap
          python - <<'PY'
          import ctypes as c
          import json, hashlib, os, re, shutil
          from pathlib import Path
          import mpyq
          from runtime_catalog_journal import MAP_NAME, MAP_SHA256, Storm
          from mpq_mixed_sectors import read_member
          s = Storm()
          root = Path('work/journal-map')
          path = root / MAP_NAME
          members = s.members(path)
          a = mpyq.MPQArchive(str(path), listfile=False)
          try:
              for name, expected in members.items():
                  assert read_member(a, name) == expected, name
          finally:
              a.file.close()
          s.lib.SFileVerifyFile.argtypes = [c.c_void_p, c.c_char_p, c.c_uint32]
          s.lib.SFileVerifyFile.restype = c.c_uint32
          s.lib.SFileVerifyRawData.argtypes = [c.c_void_p, c.c_uint32, c.c_char_p]
          s.lib.SFileVerifyRawData.restype = c.c_int
          h = s.open(path)
          try:
              tables = {str(k): s.lib.SFileVerifyRawData(h, k, None) for k in range(1, 7)}
              files = {n: s.lib.SFileVerifyFile(h, n.encode(), 15) for n in members}
          finally:
              s.lib.SFileCloseArchive(h)
          assert not any(tables.values()) and not any(v & 0x02ab for v in files.values())
          log = Path('work/journal-evidence/tests.log').read_text()
          count = int(re.search(r'Ran (\d+) tests', log)[1])
          assert count == 143 and log.rstrip().endswith('OK') and 'skipped' not in log.lower()
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          template = Path('scripts/run_catalog_journal.ps1').read_text()
          assert template.count('@MAP_SHA256@') == 1
          (root / 'run_catalog_journal.ps1').write_text(template.replace('@MAP_SHA256@', digest), encoding='utf-8')
          shutil.copyfile('scripts/START_CATALOG_JOURNAL.cmd', root / 'START_CATALOG_JOURNAL.cmd')
          (root / (MAP_NAME + '.sha256')).write_text(digest + '  ' + MAP_NAME + '\n')
          (Path('work/journal-evidence') / 'original-MapScript.galaxy').write_bytes(s.members(Path('work/DragonShire.s2ma'))['MapScript.galaxy'])
          result = {'run_id': int(os.environ['GITHUB_RUN_ID']), 'tested_commit': os.environ['GITHUB_SHA'],
                    'tests_passed': count, 'tests_failed': 0, 'tests_skipped': 0,
                    'independent_archive_members_checked': len(members), 'native_table_results': tables,
                    'native_file_verification_flags': files, 'source_map_sha256': MAP_SHA256,
                    'map_sha256': digest, 'map_bytes': path.stat().st_size, 'repeated_generation_identical': True,
                    'game_client_started': False, 'runtime_export_observed': False,
                    'native_galaxy_compilation_verified': False, 'client_playback_validated': False,
                    'replay_modified': False, 'strong_archive_signature_authenticity_claimed': False}
          Path('work/journal-evidence/verification.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Check Galaxy syntax with a separately pinned parser, not the game compiler
        run: |
          node - <<'JS'
          const fs = require('fs');
          const parse = require('./_galaxy/lib');
          const reports = {};
          for (const path of ['work/journal-evidence/original-MapScript.galaxy', 'work/journal-map/MapScript.galaxy', 'work/journal-map/catalog-journal.galaxy']) {
            const tree = parse(fs.readFileSync(path, 'utf8'));
            if (!tree) throw new Error('Parser returned no syntax tree');
            reports[path] = {parsed: true};
          }
          let rejected = false;
          try { parse('void broken( {'); } catch (e) { rejected = true; }
          if (!rejected) throw new Error('Invalid syntax was not rejected');
          fs.writeFileSync('work/journal-evidence/galaxy-syntax.json', JSON.stringify({parser_commit:'c2f9cc65f234fef07261879b27a23ee796ff07f3', reports, invalid_fixture_rejected:rejected, native_compilation_verified:false}, null, 2));
          JS
      - name: Preserve source and full Git history
        if: always()
        run: |
          mkdir -p work/journal-evidence
          cp runtime_catalog_journal.py test_catalog_journal.py test_catalog_journal_collector.py work/journal-evidence/
          cp scripts/run_catalog_journal.ps1 work/journal-evidence/launcher-template.ps1
          git bundle create work/journal-evidence/source.bundle HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: catalog-journal-map-${{ github.run_id }}
          path: |
            work/journal-map/
            work/journal-evidence/
          retention-days: 30

  windows:
    strategy:
      fail-fast: false
      matrix:
        engine: [powershell, pwsh]
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      HOTS_TEST_POWERSHELL: ${{ matrix.engine }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Execute collector and guards on local Windows fixtures
        run: |
          set -euo pipefail
          mkdir -p work/windows-journal
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for name, expected in {'scripts/run_catalog_journal.ps1':'cec468ef0d8816eb711dbbb8f218340842190754b1881f05768d1fe2a9893401', 'test_catalog_journal_collector.py':'4ac15f4c5ae83c9bde6ccbf908d38768211c1c3f1168c21e516aedba38797323'}.items():
              assert hashlib.sha256(Path(name).read_bytes().replace(b'\r\n', b'\n')).hexdigest() == expected, name
          PY
          python -m unittest -v test_catalog_journal_collector 2>&1 | tee work/windows-journal/tests.log
          python - <<'PY'
          import json, re, os, subprocess
          from pathlib import Path
          log = Path('work/windows-journal/tests.log').read_text()
          assert int(re.search(r'Ran (\d+) tests', log)[1]) == 15 and log.rstrip().endswith('OK') and 'skipped' not in log.lower()
          version = subprocess.check_output([os.environ['HOTS_TEST_POWERSHELL'], '-NoProfile', '-Command', '$PSVersionTable.PSVersion.ToString()'], text=True).strip()
          result = {'run_id': int(os.environ['GITHUB_RUN_ID']), 'tested_commit':os.environ['GITHUB_SHA'], 'engine':os.environ['HOTS_TEST_POWERSHELL'], 'version':version, 'tests_passed':15, 'tests_failed':0, 'tests_skipped':0, 'fixture_collection_executed':True, 'game_client_started':False, 'live_cloud_provider_tested':False, 'actual_user_export_observed':False}
          Path('work/windows-journal/verification.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: catalog-journal-${{ matrix.engine }}-${{ github.run_id }}
          path: work/windows-journal/
          retention-days: 30
