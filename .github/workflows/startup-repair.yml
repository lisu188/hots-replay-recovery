name: Current client startup repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/startup-repair.yml'
      - 'repair_startup.py'
      - 'test_startup.py'
      - 'references/build-98297.config'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: startup-repair-98297
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/_upstream:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Blizzard/heroprotocol
          ref: 9af3ea7150f1a8acb53464c92519a9bbcc7a3594
          path: _upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install native writer and preserve runtime provenance
        run: |
          python -m pip install six==1.17.0 mpyq==0.2.5
          sudo apt-get update -qq
          sudo apt-get install -y libstorm-dev
          mkdir -p work/native-runtime
          dpkg-query -W libstorm9 libstorm-dev libtomcrypt1 libtommath1 | tee work/native-runtime/packages.txt
          dpkg -L libstorm9 libtomcrypt1 libtommath1 | grep -E '/lib[^/]*\.so(\.[0-9]+)*$' | while IFS= read -r library; do
            cp -L "$library" "work/native-runtime/$(basename "$library")"
          done
          header=$(dpkg -L libstorm-dev | grep '/StormLib.h$')
          cp "$header" work/native-runtime/
          for package in libstorm9 libtomcrypt1 libtommath1; do
            cp "/usr/share/doc/$package/copyright" "work/native-runtime/$package-copyright.txt"
          done
          python - <<'PY'
          import ctypes
          import ctypes.util
          library = ctypes.util.find_library('storm')
          if not library:
              raise RuntimeError('Installed StormLib is not discoverable')
          ctypes.CDLL(library)
          print('Loaded native writer:', library)
          PY
      - name: Restore hash-bound public inputs
        run: |
          python scripts/restore_artifact.py artifacts/TEN_GREYMANE_source_41810.StormReplay.base64 work/TEN_GREYMANE_source_41810.StormReplay --sha256 artifacts/TEN_GREYMANE_source_41810.StormReplay.sha256
          old=client-checkpoints/98285/TEN_GREYMANE_client98285_EXPERIMENTAL.StormReplay
          python scripts/restore_artifact.py "$old.base64" work/previous.StormReplay --sha256 "$old.sha256"
          fixture=checkpoints/44256/TEN_GREYMANE_protocol44256.StormReplay
          python scripts/restore_artifact.py "$fixture.base64" "$fixture" --sha256 "$fixture.sha256"
      - name: Run new and regression tests
        run: python -m unittest -v test_startup test_reference test_client_binding test_reproduce_client test_playback_diagnostics test_repack_control 2>&1 | tee work/startup-tests.log
      - name: Create native-format startup repair
        run: |
          python repair_startup.py --source work/TEN_GREYMANE_source_41810.StormReplay --previous work/previous.StormReplay --build-config references/build-98297.config --output work/startup-r2 | tee work/startup-repair.log
      - name: Verify reproducibility and publish text checkpoint
        run: |
          python repair_startup.py --source work/TEN_GREYMANE_source_41810.StormReplay --previous work/previous.StormReplay --build-config references/build-98297.config --output work/startup-r2-repeat > work/startup-repeat.log
          cmp work/startup-r2/*.StormReplay work/startup-r2-repeat/*.StormReplay
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('work/startup-r2/report.json').read_text())
          result = {'run_id': int(os.environ['GITHUB_RUN_ID']), 'tested_commit': os.environ['GITHUB_SHA'],
                    'writer_sha256': hashlib.sha256(Path('repair_startup.py').read_bytes()).hexdigest(),
                    'repeated_native_generation_identical': True, 'candidate_sha256': report['artifact']['sha256'],
                    'native_writer_used': True, 'client_playback_validated': False}
          Path('work/startup-r2/ci-verification.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c startup-r2-${GITHUB_RUN_ID}
          mkdir -p client-checkpoints/98297-startup-r2
          cp work/startup-r2/*.json work/startup-r2/*.jsonl work/startup-r2/*.sha256 work/startup-r2/*.base64.part* client-checkpoints/98297-startup-r2/
          git add -- client-checkpoints/98297-startup-r2
          git commit -m "Publish structurally verified startup repair 98297 R2 for run ${GITHUB_RUN_ID}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve exact source history
        if: always()
        run: git bundle create work/startup-repair-source.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-repair-${{ github.run_id }}
          retention-days: 30
          path: |
            work/startup-r2/
            work/startup-*.log
            work/startup-repair-source.bundle
            work/native-runtime/
