name: Same-map Dragon Shire dependency experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dragon-dependencies.yml'
      - 'repair_dragon_dependencies.py'
      - 'test_dragon_dependencies.py'
      - 'test_empty_mpq_members.py'
      - 'mpq_reader.py'
      - 'observations/dragon-98285-2026-09-29.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dragon-dependencies-r5
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/_upstream:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Blizzard/heroprotocol
          ref: 9af3ea7150f1a8acb53464c92519a9bbcc7a3594
          path: _upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install independent readers and native writer
        run: |
          python -m pip install six==1.17.0 mpyq==0.2.5
          sudo apt-get update -qq
          sudo apt-get install -y libstorm-dev
          mkdir -p work
          dpkg-query -W libstorm9 libstorm-dev libtomcrypt1 libtommath1 > work/dragon-native-packages.txt
      - name: Restore immutable public fixtures
        run: |
          source=artifacts/TEN_GREYMANE_source_41810.StormReplay
          python scripts/restore_artifact.py "$source.base64" work/TEN_GREYMANE_source_41810.StormReplay --sha256 "$source.sha256"
          fixture=checkpoints/44256/TEN_GREYMANE_protocol44256.StormReplay
          python scripts/restore_artifact.py "$fixture.base64" "$fixture" --sha256 "$fixture.sha256"
          r3=client-checkpoints/98285-native-r3/TEN_GREYMANE_client98285_NATIVE_R3_EXPERIMENTAL.StormReplay
          python scripts/restore_artifact.py "$r3.base64" "$r3" --sha256 "$r3.sha256"
          r4=client-checkpoints/98285-controls-r4/TEN_GREYMANE_client98285_CONTROLS_R4_EXPERIMENTAL.StormReplay
          python scripts/restore_artifact.py "$r4.base64" work/R4.StormReplay --sha256 "$r4.sha256"
      - name: Test R5 and existing regressions
        run: python -m unittest -v test_empty_mpq_members test_dragon_dependencies test_control_masks test_live_identity test_startup test_reference test_client_binding test_reproduce_client test_playback_diagnostics test_repack_control 2>&1 | tee work/dragon-tests.log
      - name: Generate and independently validate twice
        run: |
          python repair_dragon_dependencies.py --source work/R4.StormReplay --observation observations/dragon-98285-2026-09-29.json --output work/dragon-r5 | tee work/dragon-build.log
          python repair_dragon_dependencies.py --source work/R4.StormReplay --observation observations/dragon-98285-2026-09-29.json --output work/dragon-r5-repeat > work/dragon-repeat.log
          cmp work/dragon-r5/*.StormReplay work/dragon-r5-repeat/*.StormReplay
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          expected = {'repair_dragon_dependencies.py': 'b74f7f3f6293a5f2199ba545b2f58f842ce25d0965276701cf87f0e4cddf6a0c',
                      'test_dragon_dependencies.py': '38866f59024b0df43bf5bcc24b21dcb8bb80b2397a1a2b754d869918e9ccf8fd',
                      'observations/dragon-98285-2026-09-29.json': 'f912fdcafdb57759280200619f4f7ab7f7a67b86a62453c19af20a8c7f68e13c'}
          for name, digest in expected.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                  raise RuntimeError('Locally reviewed source differs: ' + name)
          report = json.loads(Path('work/dragon-r5/report.json').read_text())
          if report['artifact']['sha256'] != 'f5eac2c4de55db9cc834c97825ac89d5fc0bb4807a2b216ba5ca7fbc63e45f11':
              raise RuntimeError('CI output differs from the local R5 candidate')
          log = Path('work/dragon-tests.log').read_text()
          if 'skipped' in log.lower() or not log.rstrip().endswith('OK'):
              raise RuntimeError('The complete test suite did not pass')
          count = int(re.search(r'Ran (\d+) tests', log)[1])
          if count < 157:
              raise RuntimeError('Expected at least 157 tests')
          result = {'run_id': int(os.environ['GITHUB_RUN_ID']), 'tested_commit': os.environ['GITHUB_SHA'],
                    'test_count': count, 'repeated_generation_identical': True, 'matches_local_sha256': True,
                    'candidate_sha256': report['artifact']['sha256'], 'source_pins': expected,
                    'private_donor_supplied_to_ci': False, 'client_playback_validated': False,
                    'simulation_compatibility_validated': False}
          Path('work/dragon-r5/ci-verification.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Publish verified text checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c dragon-r5-${GITHUB_RUN_ID}
          mkdir -p client-checkpoints/98285-dragon-r5
          cp work/dragon-r5/*.json work/dragon-r5/*.jsonl work/dragon-r5/*.sha256 work/dragon-r5/*.base64.part* client-checkpoints/98285-dragon-r5/
          git add -- client-checkpoints/98285-dragon-r5
          git commit -m "Publish same-map R5 checkpoint for run ${GITHUB_RUN_ID}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve complete source history
        if: always()
        run: |
          mkdir -p work
          git bundle create work/dragon-r5-source.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dragon-r5-${{ github.run_id }}
          retention-days: 30
          path: |
            work/dragon-r5/
            work/dragon-*.log
            work/dragon-native-packages.txt
            work/dragon-r5-source.bundle
