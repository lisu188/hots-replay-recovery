name: Read-only startup interval audit

on:
  push:
    branches: [main]
    paths:
      - 'audit_startup_interval.py'
      - 'test_startup_interval.py'
      - '.github/workflows/startup-interval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/_upstream:${{ github.workspace }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Blizzard/heroprotocol
          ref: 9af3ea7150f1a8acb53464c92519a9bbcc7a3594
          path: _upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check reviewed source and restore immutable recordings
        run: |
          python -m pip install six==1.17.0 mpyq==0.2.5
          mkdir -p work/audit
          python - <<'PY'
          import hashlib
          from pathlib import Path
          pins = {'audit_startup_interval.py': '94387dda437f4390b6fd346fd38012869e168460bccee08f52f1897439c245bb',
                  'test_startup_interval.py': 'ff118c07b1cea6c89ea083c0082a56cf2a5de5dcbd8d26b5137f1a7ac1994850',
                  'observations/runtime-catalog-reference-anchors.json': '53f70fecc2343f355f67774e9d9694e6dc5f0ac4e0083c83680611da5a2bb7a9'}
          for name, expected in pins.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected:
                  raise RuntimeError('Reviewed input differs: ' + name)
          PY
          source=artifacts/TEN_GREYMANE_source_41810.StormReplay
          python scripts/restore_artifact.py "$source.base64" work/source.StormReplay --sha256 "$source.sha256"
          r8=client-checkpoints/98285-resumable-r8/TEN_GREYMANE_client98285_RESUMABLE_R8_PARTIAL.StormReplay
          python scripts/restore_artifact.py "$r8.base64" work/R8.StormReplay --sha256 "$r8.sha256"
      - name: Run lifecycle and interval regressions
        run: |
          set -euo pipefail
          python -m unittest -v test_startup_interval test_catalog_diagnostics 2>&1 | tee work/audit/tests.log
      - name: Decode complete streams and reproduce the interval report twice
        run: |
          python audit_startup_interval.py --source work/source.StormReplay --candidate work/R8.StormReplay --output work/audit/report.json
          python audit_startup_interval.py --source work/source.StormReplay --candidate work/R8.StormReplay --output work/audit/report-repeat.json
          cmp work/audit/report.json work/audit/report-repeat.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          from pathlib import Path
          import mpyq
          from bind_client_metadata import independent_member
          from mpq_reader import MPQArchive
          result = json.loads(Path('work/audit/report.json').read_text())
          expected = {'catalog_fields': 4, 'commands': 2, 'explicit_ability_commands': 0,
                      'catalog_comparisons': {'differs_from_observed_anchor': 2, 'no_current_reference_anchor': 2}}
          if result['startup']['counts'] != expected or not result['sync_payloads_identical']:
              raise RuntimeError('First interval differs from the reviewed observations')
          if result['candidate_sync']['record_count'] != 308 or result['replay_modified'] or result['client_playback_validated']:
              raise RuntimeError('Sync framing or evidence status changed')
          checked = 0
          for filename in ('work/source.StormReplay', 'work/R8.StormReplay'):
              own = MPQArchive(Path(filename))
              independent = mpyq.MPQArchive(filename)
              try:
                  for name in ('replay.game.events', 'replay.message.events', 'replay.tracker.events', 'replay.sync.events'):
                      if own.read_file(name) != independent_member(independent, name):
                          raise RuntimeError('Independent member decode disagrees: ' + name)
                      checked += 1
              finally:
                  own.close()
                  independent.file.close()
          log = Path('work/audit/tests.log').read_text()
          count = int(re.search(r'Ran (\d+) tests', log)[1])
          if count != 55 or 'skipped' in log.lower() or not log.rstrip().endswith('OK'):
              raise RuntimeError('Requested regressions did not all pass')
          verification = {'run_id': int(os.environ['GITHUB_RUN_ID']), 'tested_commit': os.environ['GITHUB_SHA'],
                          'tests_passed': count, 'tests_failed': 0, 'tests_skipped': 0,
                          'independent_members_checked': checked, 'reports_identical': True,
                          'report_sha256': hashlib.sha256(Path('work/audit/report.json').read_bytes()).hexdigest(),
                          'native_stormlib_run': False, 'game_client_started': False,
                          'replay_modified': False, 'client_playback_validated': False}
          Path('work/audit/verification.json').write_text(json.dumps(verification, indent=2) + '\n')
          for file in ('audit_startup_interval.py', 'test_startup_interval.py'):
              shutil.copyfile(file, Path('work/audit') / file)
          for file in ('decoders.py', 'versions/protocol41810.py', 'versions/protocol96477.py'):
              dst = Path('work/audit/upstream/heroprotocol') / file
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(Path('_upstream/heroprotocol') / file, dst)
          shutil.copyfile('_upstream/LICENSE', 'work/audit/upstream/LICENSE')
          PY
          git bundle create work/audit/source.bundle HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-interval-${{ github.run_id }}
          path: work/audit/
          retention-days: 30
