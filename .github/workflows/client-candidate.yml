name: Client candidate verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-candidate.yml'
      - 'client-checkpoints/98285/recipe.json'
      - 'reproduce_client_candidate.py'
      - 'test_reproduce_client.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-candidate-98285
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/_upstream:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Blizzard/heroprotocol
          ref: 9af3ea7150f1a8acb53464c92519a9bbcc7a3594
          path: _upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install independent readers
        run: |
          python -m pip install six==1.17.0 mpyq==0.2.5
          sudo apt-get update -qq
          sudo apt-get install -y libstorm-dev
      - name: Restore immutable source and binding fixture
        run: |
          mkdir -p work
          python scripts/restore_artifact.py artifacts/TEN_GREYMANE_source_41810.StormReplay.base64 work/TEN_GREYMANE_source_41810.StormReplay --sha256 artifacts/TEN_GREYMANE_source_41810.StormReplay.sha256
          base=checkpoints/44256/TEN_GREYMANE_protocol44256.StormReplay
          python scripts/restore_artifact.py "$base.base64" "$base" --sha256 "$base.sha256"
      - name: Run reference, binding and reproduction tests
        run: python -m unittest -v test_reference test_client_binding test_reproduce_client 2>&1 | tee work/client-tests.log
      - name: Reproduce and verify candidate independently
        run: |
          python reproduce_client_candidate.py client-checkpoints/98285/recipe.json --output work/client-candidate
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import mpyq
          from mpq_reader import MPQArchive
          from mpq_rebuild import verify_container
          from reference_replay import inspect_reference
          from verify_checkpoint import stormlib_check
          path = Path('work/client-candidate/TEN_GREYMANE_client98285_EXPERIMENTAL.StormReplay')
          profile = inspect_reference(path, 96477, 98285)
          expected = json.loads(Path('client-checkpoints/98285/report.json').read_text())
          assert {k: v['count'] for k, v in profile['streams'].items()} == expected['events']
          assert hashlib.sha256(path.read_bytes()).hexdigest() == expected['artifact']['sha256']
          own = MPQArchive(path)
          other = mpyq.MPQArchive(str(path), listfile=False)
          try:
              names = list(dict.fromkeys(own.read_file('(listfile)').decode().splitlines() + ['(listfile)', '(attributes)']))
              members = {name: own.read_file(name) for name in names}
              assert all(other.read_file(name) == raw for name, raw in members.items())
              result = {'format': 'hots-client-candidate-ci-v1', 'run_id': int(os.environ['GITHUB_RUN_ID']),
                        'tested_commit': os.environ['GITHUB_SHA'], 'sha256': profile['file_sha256'],
                        'official_candidate_all_streams_roundtrip': True, 'mpyq_all_members_equal': True,
                        'stormlib': stormlib_check(path, members, True), 'mpq_v4': verify_container(path),
                        'reference_revalidated_this_run': False, 'client_playback_validated': False,
                        'simulation_compatibility_validated': False}
              Path('work/client-verification.json').write_text(json.dumps(result, indent=2) + '\n')
              print(json.dumps(result, indent=2))
          finally:
              own.close()
              other.file.close()
          PY
      - name: Publish verified Base64 parts and preserve complete history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c client-candidate-${GITHUB_RUN_ID}
          cp work/client-candidate/*.base64.part* client-checkpoints/98285/
          cp work/client-candidate/*.sha256 client-checkpoints/98285/
          cp work/client-verification.json client-checkpoints/98285/ci-verification.json
          git add -- client-checkpoints/98285/*.base64.part* client-checkpoints/98285/*.sha256 client-checkpoints/98285/ci-verification.json
          git commit -m "Publish independently verified client 98285 Base64 artifact for run ${GITHUB_RUN_ID}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git bundle create work/hots-client-98285-complete.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: client-98285-${{ github.run_id }}
          retention-days: 30
          path: |
            work/client-candidate/
            work/client-tests.log
            work/client-verification.json
            work/hots-client-98285-complete.bundle
